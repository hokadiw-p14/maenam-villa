<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="จองห้องพัก Maenam Villa Hotel"><link rel="stylesheet" href="assets/app.css"><title>Booking · Maenam Villa</title></head><body><header class="nav"><a class="brand" href="index.html">MAENAM <span>VILLA</span></a><nav><a href="index.html#rooms">ห้องพัก</a><a href="index.html#gallery">แกลเลอรี</a><a href="index.html#contact">ติดต่อ</a></nav><button id="lang" class="lang">EN</button></header><main class="booking-page"><div><p class="eyebrow">BOOKING</p><h1 data-i18n="booking.title">ส่งคำขอจองห้องพัก</h1><p data-i18n="booking.sub">กรอกข้อมูล แล้วระบบจะเปิดอีเมลพร้อมรายละเอียดให้ส่งถึงที่พัก</p></div><form id="booking-form" class="booking-form"><label data-i18n="form.name">ชื่อผู้เข้าพัก<input name="name" required></label><label data-i18n="form.email">อีเมล<input type="email" name="email" required></label><div class="two"><label data-i18n="form.checkin">เช็กอิน<input type="date" name="checkin" required></label><label data-i18n="form.checkout">เช็กเอาต์<input type="date" name="checkout" required></label></div><label data-i18n="form.room">ห้องพัก<select name="room" id="room"></select></label><label data-i18n="form.guests">จำนวนผู้เข้าพัก<input type="number" name="guests" min="1" value="2" required></label><label data-i18n="form.message">ข้อความเพิ่มเติม<textarea name="message" rows="5"></textarea></label><button class="btn" type="submit" data-i18n="form.submit">สร้างอีเมลจองห้อง</button><p id="result" class="result"></p></form></main><footer><span>© <span id="year"></span> Maenam Villa Hotel</span></footer><script src="assets/app.js"></script><script src="assets/booking.js"></script></body></html>
